        body.login-page {
            min-height: 100dvh;
            background:
                radial-gradient(820px 420px at 84% -4%, color-mix(in oklab, #22d3ee 10%, transparent), transparent 68%),
                radial-gradient(680px 340px at 0% 8%, color-mix(in oklab, #22c55e 8%, transparent), transparent 72%),
                var(--bg);
        }

        body.login-page main,
        #admin-login.section {
            min-height: 100dvh;
        }

        .login-sprite-field {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: -1;
        }

        .login-sprite {
            --phase: 0s;
            --sprite-color: color-mix(in oklab, var(--accent) 72%, white);
            position: absolute;
            width: 144px;
            aspect-ratio: 1 / 1;
            opacity: 0.22;
            filter: drop-shadow(0 0 18px color-mix(in oklab, var(--sprite-color) 36%, transparent));
            animation: spriteDrift var(--float-duration, 16s) ease-in-out infinite;
            transform-origin: center;
        }

        .login-sprite-frame {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            color: var(--sprite-color);
            opacity: 0;
            animation: spriteCycle 12s steps(1, end) infinite;
        }

        .login-sprite-frame.frame-1 {
            animation-delay: var(--phase);
        }

        .login-sprite-frame.frame-2 {
            animation-delay: calc(var(--phase) + 4s);
        }

        .login-sprite-frame.frame-3 {
            animation-delay: calc(var(--phase) + 8s);
        }

        .login-sprite svg {
            width: 100%;
            height: 100%;
            display: block;
            image-rendering: pixelated;
            shape-rendering: crispEdges;
        }

        .sprite-left {
            top: 10vh;
            left: max(18px, 4vw);
            --sprite-color: color-mix(in oklab, #4ade80 78%, white);
            --float-duration: 17s;
        }

        .sprite-right {
            top: 16vh;
            right: max(22px, 4vw);
            --sprite-color: color-mix(in oklab, #22d3ee 78%, white);
            --float-duration: 15s;
            --phase: -2s;
        }

        .sprite-bottom {
            right: 16vw;
            bottom: 7vh;
            width: 126px;
            --sprite-color: color-mix(in oklab, #fb7185 74%, white);
            --float-duration: 18s;
            --phase: -4.5s;
        }

        #admin-login.section {
            padding: 0;
            display: grid;
        }

        .login-wrap {
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 18px;
        }

        .login-card {
            width: min(405px, 90vw);
            padding: 20px;
            position: relative;
            overflow: hidden;
            isolation: isolate;
            border-radius: 24px;
            border-color: color-mix(in oklab, var(--accent) 20%, var(--line));
            background:
                linear-gradient(180deg, color-mix(in oklab, var(--surface) 97%, transparent), color-mix(in oklab, var(--surface-soft) 93%, transparent));
            box-shadow:
                0 24px 50px rgba(0, 0, 0, 0.34),
                0 0 0 1px color-mix(in oklab, var(--accent) 8%, transparent);
        }

        .login-card::before,
        .login-card::after {
            content: "";
            position: absolute;
            pointer-events: none;
            z-index: 0;
        }

        .login-card::before {
            inset: 0;
            background:
                repeating-linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.05) 0,
                    rgba(255, 255, 255, 0.05) 1px,
                    transparent 1px,
                    transparent 4px);
            opacity: 0.2;
            mix-blend-mode: overlay;
            animation: loginScan 12s linear infinite;
        }

        .login-card::after {
            inset: 10px;
            border: 1px dashed color-mix(in oklab, var(--line-strong) 84%, transparent);
            border-radius: 18px;
            opacity: 0.55;
        }

        .login-card>* {
            position: relative;
            z-index: 1;
        }

        .login-pixels {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .login-pixels span {
            position: absolute;
            width: 10px;
            height: 10px;
            background: color-mix(in oklab, var(--accent) 70%, white);
            opacity: 0.15;
            image-rendering: pixelated;
            box-shadow: 0 0 18px color-mix(in oklab, var(--accent) 28%, transparent);
            animation: pixelBlink var(--blink-speed, 3.6s) steps(2, end) infinite;
        }

        .login-pixels span:nth-child(1) {
            top: 20px;
            left: 68px;
            --blink-speed: 2.8s;
        }

        .login-pixels span:nth-child(2) {
            top: 60px;
            right: 84px;
            background: #4ade80;
            --blink-speed: 3.9s;
        }

        .login-pixels span:nth-child(3) {
            top: 148px;
            right: 26px;
            background: #fbbf24;
            --blink-speed: 4.2s;
        }

        .login-pixels span:nth-child(4) {
            bottom: 118px;
            left: 28px;
            background: #fb7185;
            --blink-speed: 3.3s;
        }

        .login-pixels span:nth-child(5) {
            bottom: 82px;
            right: 52px;
            width: 8px;
            height: 8px;
            --blink-speed: 2.7s;
        }

        .login-pixels span:nth-child(6) {
            bottom: 26px;
            left: 108px;
            background: #22d3ee;
            --blink-speed: 4.5s;
        }

        .login-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: color-mix(in oklab, var(--surface) 88%, transparent);
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
        }

        .back-btn:hover,
        .back-btn:focus-visible {
            transform: translateY(-1px);
            border-color: color-mix(in oklab, #22d3ee 60%, rgba(255, 255, 255, 0.18));
            box-shadow: 0 0 22px rgba(34, 211, 238, 0.18);
            outline: none;
        }

        .login-leds {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: color-mix(in oklab, var(--surface) 90%, transparent);
        }

        .login-leds span {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: currentColor;
            box-shadow: 0 0 12px currentColor;
            animation: ledPulse 2.1s ease-in-out infinite;
        }

        .login-leds span:nth-child(1) {
            color: #4ade80;
        }

        .login-leds span:nth-child(2) {
            color: #fbbf24;
            animation-delay: .2s;
        }

        .login-leds span:nth-child(3) {
            color: #fb7185;
            animation-delay: .4s;
        }

        .login-hero {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 18px;
            margin-bottom: 10px;
        }

        .login-badge-stack {
            min-width: 0;
        }

        .login-chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .login-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            min-height: 30px;
            padding: 7px 11px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: color-mix(in oklab, var(--surface) 90%, transparent);
            font-family: var(--font-retro);
            font-size: 0.52rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            line-height: 1.4;
            color: var(--accent-strong);
        }

        .login-chip::before {
            content: "";
            width: 8px;
            height: 8px;
            background: currentColor;
            border-radius: 999px;
            box-shadow: 0 0 12px currentColor;
            opacity: 0.88;
            flex: 0 0 auto;
        }

        .login-chip.is-live {
            color: #4ade80;
        }

        .login-chip.is-success {
            color: #c4f8d2;
        }

        .login-chip.is-busy {
            color: #fde68a;
        }

        .login-chip.is-error {
            color: #fda4af;
        }

        .login-emblem {
            width: 84px;
            height: 84px;
            flex: 0 0 auto;
            display: grid;
            place-items: center;
            border-radius: 20px;
            border: 1px solid var(--line);
            background:
                radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.08), transparent 42%),
                color-mix(in oklab, var(--surface) 92%, transparent);
            box-shadow:
                inset 0 0 0 1px color-mix(in oklab, var(--accent) 10%, transparent),
                0 18px 28px rgba(0, 0, 0, 0.16);
            animation: emblemFloat 3.8s ease-in-out infinite;
        }

        .login-emblem svg {
            width: 42px;
            height: 42px;
            display: block;
            color: color-mix(in oklab, #f8fafc 88%, #22d3ee);
            image-rendering: pixelated;
            filter: drop-shadow(0 0 14px rgba(34, 211, 238, 0.18));
        }

        .login-card h1 {
            margin: 4px 0 8px;
            max-width: 12ch;
            font-size: clamp(1.45rem, 3vw, 2rem);
            line-height: 1.36;
        }

        .login-card .modal-form {
            gap: 10px;
        }

        .login-card label {
            font-family: var(--font-retro);
            font-size: 0.56rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent-strong);
        }

        .login-card .modal-form input {
            min-height: 50px;
            padding: 12px 14px;
            border-radius: 14px;
            background: color-mix(in oklab, var(--surface) 95%, transparent);
            transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
        }

        .login-card .modal-form input:focus {
            border-color: color-mix(in oklab, var(--accent) 42%, white);
            box-shadow: 0 0 0 4px color-mix(in oklab, var(--accent) 10%, transparent);
            outline: none;
            transform: translateY(-1px);
        }

        .login-card .btn-primary {
            width: 100%;
            margin-top: 6px;
            min-height: 48px;
            position: relative;
            overflow: hidden;
        }

        .login-card .btn-primary::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(120deg,
                    transparent 10%,
                    rgba(255, 255, 255, 0.36) 48%,
                    transparent 84%);
            transform: translateX(-135%);
            transition: transform .72s ease;
            pointer-events: none;
        }

        .login-card .btn-primary:hover::after,
        .login-card .btn-primary:focus-visible::after {
            transform: translateX(135%);
        }

        .login-card .form-hint,
        .login-card .toast {
            padding: 10px 12px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: color-mix(in oklab, var(--surface) 90%, transparent);
        }

        .login-card .form-hint {
            margin-top: 4px;
        }

        .login-card .toast {
            margin-top: 10px;
        }

        @keyframes loginScan {
            0% {
                transform: translateY(0);
            }
            100% {
                transform: translateY(4px);
            }
        }

        @keyframes spriteCycle {
            0%,
            26% {
                opacity: 1;
            }
            33%,
            100% {
                opacity: 0;
            }
        }

        @keyframes spriteDrift {
            0%,
            100% {
                transform: translate3d(0, 0, 0) scale(1) rotate(0deg);
            }
            33% {
                transform: translate3d(10px, -14px, 0) scale(1.04) rotate(-3deg);
            }
            66% {
                transform: translate3d(-12px, 8px, 0) scale(0.97) rotate(3deg);
            }
        }

        @keyframes pixelBlink {
            0%,
            40%,
            100% {
                opacity: 0.12;
                transform: scale(1);
            }
            50% {
                opacity: 0.3;
                transform: scale(1.05);
            }
        }

        @keyframes ledPulse {
            0%,
            100% {
                opacity: 0.45;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.16);
            }
        }

        @keyframes emblemFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-4px);
            }
        }

        @media (max-width: 620px) {
            .login-wrap {
                padding: 14px;
            }

            .login-sprite {
                width: 96px;
                opacity: 0.16;
            }

            .sprite-left {
                top: 9vh;
                left: -8px;
            }

            .sprite-right {
                top: 12vh;
                right: -10px;
            }

            .sprite-bottom {
                right: 10vw;
                bottom: 8vh;
                width: 88px;
            }

            .login-card {
                width: min(405px, 92vw);
                padding: 18px;
            }

            .login-hero {
                flex-direction: column;
                align-items: stretch;
            }

            .login-emblem {
                width: 82px;
                height: 82px;
                align-self: flex-end;
            }

            .login-card h1 {
                max-width: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .login-sprite {
                animation: none;
            }

            .login-sprite-frame {
                animation: none;
                opacity: 0;
            }

            .login-sprite-frame.frame-1 {
                opacity: 1;
            }
        }
    </style>
</head>

                        <rect x="4" y="9" width="2" height="1"></rect>
                        <rect x="7" y="9" width="2" height="1"></rect>
                        <rect x="10" y="9" width="2" height="1"></rect>
                    </g>
                </svg>
            </div>
            <div class="login-sprite-frame frame-3">
                <svg viewBox="0 0 16 16" focusable="false">
                    <g fill="currentColor">
                        <rect x="7" y="2" width="2" height="1"></rect>
                        <rect x="6" y="3" width="4" height="1"></rect>
                        <rect x="5" y="4" width="6" height="1"></rect>
                        <rect x="4" y="5" width="8" height="1"></rect>
                        <rect x="3" y="6" width="10" height="1"></rect>
                        <rect x="4" y="7" width="8" height="1"></rect>
                        <rect x="5" y="8" width="6" height="1"></rect>
                        <rect x="6" y="9" width="4" height="1"></rect>
                        <rect x="7" y="10" width="2" height="1"></rect>
                    </g>
                </svg>
            </div>
        </div>
    </div>

    <main>
        <section class="section" id="admin-login">
            <div class="container login-wrap">
                <div class="panel login-card" role="region" aria-label="Admin login">
                    <div class="login-pixels" aria-hidden="true">
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="login-topbar">
                        <a class="back-btn" href="index.html" aria-label="Back to home">&larr;</a>
                        <div class="login-leds" aria-hidden="true">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>

                    <div class="login-hero">
                        <div class="login-badge-stack">
                            <p class="eyebrow">Restricted</p>
                            <div class="login-chip-row">
                                <span class="login-chip is-success" id="loginStateChip">Ready</span>
                            </div>
                        </div>

                        <div class="login-emblem" aria-hidden="true">
                            <svg viewBox="0 0 32 32" focusable="false" shape-rendering="crispEdges">
                                <g fill="currentColor">
                                    <rect x="10" y="4" width="12" height="2"></rect>
                                    <rect x="8" y="6" width="2" height="4"></rect>
                                    <rect x="22" y="6" width="2" height="4"></rect>
                                    <rect x="8" y="10" width="16" height="2"></rect>
                                    <rect x="6" y="12" width="20" height="2"></rect>
                                    <rect x="6" y="14" width="20" height="12"></rect>
                                    <rect x="12" y="18" width="8" height="2"></rect>
                                    <rect x="14" y="20" width="4" height="4"></rect>
                                </g>
                            </svg>
                        </div>
                    </div>

                    <h1>Admin Login</h1>

                    <form class="modal-form" id="adminLoginForm" autocomplete="on" novalidate>
                        <label for="adminEmail">Email</label>
                        <input id="adminEmail" name="email" type="email" required placeholder="you@example.com"
                            autocomplete="username" maxlength="120">
                        <p class="field-hint" data-hint-for="adminEmail"
                            data-default="Use the email address you created in Supabase Auth."></p>

                        <label for="adminPassword">Password</label>
                        <input id="adminPassword" name="password" type="password" required placeholder="Enter password"
                            autocomplete="current-password" maxlength="80">
                        <p class="field-hint" data-hint-for="adminPassword" data-default="Enter your admin password.">
                        </p>

                        <button class="btn btn-primary" type="submit">Enter Admin Panel</button>
                        <p class="form-hint" id="loginHint">Tip: this uses your live backend account, not a local-only
                            password.</p>
                        <div class="toast" id="loginToast" role="status" aria-live="polite">Login successful.
                            Redirecting...</div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="backend.js"></script>
    <script src="login-app.js"></script>
</body>

</html>
