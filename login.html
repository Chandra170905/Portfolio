<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin login for Chandra Prakash portfolio panel.">
    <title>Admin Login | Chandra Prakash</title>
    <meta name="portfolio-supabase-url" content="">
    <meta name="portfolio-supabase-anon-key" content="">
    <meta name="portfolio-content-table" content="portfolio_content">
    <meta name="portfolio-admin-table" content="portfolio_admins">
    <meta name="portfolio-media-bucket" content="portfolio-media">
    <meta name="portfolio-content-id" content="site">
    <meta name="portfolio-supabase-url" content="https://zxqxlbfyusopnyekpuzk.supabase.co">
    <meta name="portfolio-supabase-anon-key" content="sb_publishable_HA0QatFC6lfEAkaZyWFkaQ_ehBkqxXQ">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Orbitron:wght@500;600;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(420px, 92vw);
            padding: 20px;
        }

        .login-card h1 {
            margin: 6px 0 6px;
        }

        .login-card .section-subtext {
            margin: 0 0 14px;
        }

        .login-card .modal-form {
            gap: 8px;
        }

        .login-card .form-hint {
            margin-top: 2px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: color-mix(in oklab, var(--surface) 88%, transparent);
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
        }

        .back-btn:hover,
        .back-btn:focus-visible {
            transform: translateY(-1px);
            border-color: color-mix(in oklab, #22d3ee 60%, rgba(255, 255, 255, 0.18));
            box-shadow: 0 0 22px rgba(34, 211, 238, 0.18);
            outline: none;
        }
    </style>
</head>

<body>
    <div class="bg-3d" aria-hidden="true">
        <span class="bg-layer layer-a"></span>
        <span class="bg-layer layer-b"></span>
        <span class="bg-layer layer-c"></span>
    </div>

    <main>
        <section class="section" id="admin-login">
            <div class="container login-wrap">
                <div class="panel login-card" role="region" aria-label="Admin login">
                    <a class="back-btn" href="index.html" aria-label="Back to home">←</a>
                    <p class="eyebrow">Restricted</p>
                    <h1>Admin Login</h1>
                    <p class="section-subtext">Sign in with your Supabase admin email and password.</p>

                    <form class="modal-form" id="adminLoginForm" autocomplete="on" novalidate>
                        <label for="adminEmail">Email</label>
                        <input id="adminEmail" name="email" type="email" required placeholder="you@example.com"
                            autocomplete="username" maxlength="120">
                        <p class="field-hint" data-hint-for="adminEmail"
                            data-default="Use the email address you created in Supabase Auth."></p>

                        <label for="adminPassword">Password</label>
                        <input id="adminPassword" name="password" type="password" required placeholder="Enter password"
                            autocomplete="current-password" maxlength="80">
                        <p class="field-hint" data-hint-for="adminPassword" data-default="Enter your admin password.">
                        </p>

                        <button class="btn btn-primary" type="submit">Login</button>
                        <p class="form-hint" id="loginHint">Tip: this uses your live backend account, not a local-only
                            password.</p>
                        <div class="toast" id="loginToast" role="status" aria-live="polite">Login successful.
                            Redirecting…</div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="backend.js"></script>
    <script src="login-app.js"></script>
</body>

</html>
