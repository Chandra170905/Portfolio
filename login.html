<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Admin login for Chandra Prakash portfolio panel.">
    <title>Admin Login | Chandra Prakash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Orbitron:wght@500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .login-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .login-card {
            width: min(420px, 92vw);
            padding: 20px;
        }

        .login-card h1 { margin: 6px 0 6px; }
        .login-card .section-subtext { margin: 0 0 14px; }
        .login-card .modal-form { gap: 8px; }
        .login-card .form-hint { margin-top: 2px; }

        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: color-mix(in oklab, var(--surface) 88%, transparent);
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease, background .16s ease;
        }

        .back-btn:hover,
        .back-btn:focus-visible {
            transform: translateY(-1px);
            border-color: color-mix(in oklab, #22d3ee 60%, rgba(255, 255, 255, 0.18));
            box-shadow: 0 0 22px rgba(34, 211, 238, 0.18);
            outline: none;
        }
    </style>
</head>
<body>
    <div class="bg-3d" aria-hidden="true">
        <span class="bg-layer layer-a"></span>
        <span class="bg-layer layer-b"></span>
        <span class="bg-layer layer-c"></span>
    </div>

    <main>
        <section class="section" id="admin-login">
            <div class="container login-wrap">
                <div class="panel login-card" role="region" aria-label="Admin login">
                    <a class="back-btn" href="index.html" aria-label="Back to home">←</a>
                    <p class="eyebrow">Restricted</p>
                    <h1>Admin Login</h1>
                    <p class="section-subtext">Enter your credentials to open the admin panel.</p>

                    <form class="modal-form" id="adminLoginForm" autocomplete="on" novalidate>
                        <label for="adminUsername">Username</label>
                        <input id="adminUsername" name="username" type="text" required placeholder="Enter username" autocomplete="username" maxlength="40">
                        <p class="field-hint" data-hint-for="adminUsername" data-default="Enter your admin username."></p>

                        <label for="adminPassword">Password</label>
                        <input id="adminPassword" name="password" type="password" required placeholder="Enter password" autocomplete="current-password" maxlength="80">
                        <p class="field-hint" data-hint-for="adminPassword" data-default="Enter your admin password."></p>

                        <button class="btn btn-primary" type="submit">Login</button>
                        <p class="form-hint" id="loginHint">Tip: Login is stored for this session only.</p>
                        <div class="toast" id="loginToast" role="status" aria-live="polite">Login successful. Redirecting…</div>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>
        (function () {
            const storedTheme = localStorage.getItem("portfolio-theme");
            if (storedTheme === "light") {
                document.body.classList.add("light");
            }

            const AUTH_KEY = "portfolio_admin_auth_v1";
            const raw = sessionStorage.getItem(AUTH_KEY);
            const token = raw ? (() => { try { return JSON.parse(raw); } catch { return null; } })() : null;
            const isAuthed = Boolean(token && token.ok === true && typeof token.exp === "number" && Date.now() < token.exp);
            const url = new URL(window.location.href);
            const next = url.searchParams.get("next") || "admin.html";

            if (isAuthed) {
                window.location.replace(new URL(next, window.location.href).toString());
                return;
            }

            const form = document.getElementById("adminLoginForm");
            const username = document.getElementById("adminUsername");
            const password = document.getElementById("adminPassword");
            const hint = document.getElementById("loginHint");
            const toast = document.getElementById("loginToast");

            const setHint = (msg, isError) => {
                if (!hint) return;
                hint.textContent = msg;
                hint.style.color = isError ? "#ff7a7a" : "";
            };

            const EXPECTED_USERNAME = "Chandra05";
            const EXPECTED_PASSWORD = "Chandra#2005";

            if (username) username.focus();

            form?.addEventListener("submit", (e) => {
                e.preventDefault();

                const u = String(username?.value || "").trim();
                const p = String(password?.value || "");

                if (!u || !p) {
                    setHint("Please enter username and password.", true);
                    return;
                }

                if (u === EXPECTED_USERNAME && p === EXPECTED_PASSWORD) {
                    const TWO_HOURS_MS = 2 * 60 * 60 * 1000;
                    sessionStorage.setItem(AUTH_KEY, JSON.stringify({ ok: true, exp: Date.now() + TWO_HOURS_MS }));

                    if (toast) toast.classList.add("show");
                    setHint("Login successful.", false);

                    window.setTimeout(() => {
                        window.location.replace(new URL(next, window.location.href).toString());
                    }, 650);
                    return;
                }

                setHint("Invalid username or password.", true);
                if (toast) toast.classList.remove("show");
                password?.select?.();
            });
        })();
    </script>
</body>
</html>
